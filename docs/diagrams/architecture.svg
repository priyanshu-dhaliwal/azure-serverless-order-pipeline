<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8b949e"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#3fb950"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#f85149"/></marker>
  </defs>
  <rect width="1240" height="800" fill="#0d1117"/>
  <text x="28" y="38" fill="#e6edf3" font-size="22" font-weight="600">Serverless Event-Driven Order Pipeline</text>
  <text x="28" y="60" fill="#8b949e" font-size="13">at-least-once delivery · effectively-once effects · transactional outbox · per-order ordering · saga compensation</text>

  <!-- client -->
  <circle cx="48" cy="150" r="22" fill="none" stroke="#8b949e" stroke-width="1.4"/>
  <text x="48" y="155" fill="#c9d1d9" font-size="10" text-anchor="middle">client</text>

  <!-- submit -->
  <rect x="96" y="118" width="190" height="64" rx="7" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="191" y="142" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="middle">order_submit</text>
  <text x="191" y="160" fill="#c9d1d9" font-size="10" text-anchor="middle">HTTP POST /api/orders</text>
  <text x="191" y="174" fill="#6e7681" font-size="9" text-anchor="middle">validate → 202 in ~40ms</text>
  <line x1="72" y1="150" x2="92" y2="150" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- cosmos -->
  <rect x="360" y="100" width="300" height="120" rx="7" fill="#161b22" stroke="#a371f7" stroke-width="1.6"/>
  <text x="510" y="124" fill="#a371f7" font-size="12" font-weight="600" text-anchor="middle">Cosmos DB · container "orders"</text>
  <rect x="376" y="134" width="268" height="24" rx="4" fill="#0b1020" stroke="#30363d"/>
  <text x="386" y="150" fill="#c9d1d9" font-size="10">docType=order   · partition /customerId</text>
  <rect x="376" y="162" width="268" height="24" rx="4" fill="#0b1020" stroke="#3fb950"/>
  <text x="386" y="178" fill="#3fb950" font-size="10">docType=outbox  · same txn batch</text>
  <text x="376" y="204" fill="#6e7681" font-size="9">one container: a batch cannot span containers</text>
  <line x1="290" y1="150" x2="356" y2="150" stroke="#a371f7" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="296" y="140" fill="#a371f7" font-size="9">atomic</text>

  <!-- change feed -->
  <rect x="360" y="252" width="300" height="56" rx="7" fill="#161b22" stroke="#a371f7" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="510" y="274" fill="#a371f7" font-size="12" font-weight="600" text-anchor="middle">change feed</text>
  <text x="510" y="292" fill="#6e7681" font-size="9" text-anchor="middle">lease container · prefix "outbox-"</text>
  <line x1="510" y1="220" x2="510" y2="248" stroke="#a371f7" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- outbox publisher -->
  <rect x="360" y="334" width="300" height="56" rx="7" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="510" y="356" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="middle">outbox_publisher</text>
  <text x="510" y="374" fill="#6e7681" font-size="9" text-anchor="middle">mark published only AFTER the send succeeds</text>
  <line x1="510" y1="308" x2="510" y2="330" stroke="#a371f7" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- service bus -->
  <rect x="710" y="240" width="250" height="150" rx="7" fill="#161b22" stroke="#d29922" stroke-width="1.6"/>
  <text x="835" y="264" fill="#d29922" font-size="12" font-weight="600" text-anchor="middle">Service Bus</text>
  <rect x="726" y="276" width="218" height="44" rx="4" fill="#0b1020" stroke="#30363d"/>
  <text x="736" y="294" fill="#c9d1d9" font-size="10">orders-session</text>
  <text x="736" y="310" fill="#6e7681" font-size="9">session_id=orderId · FIFO per order</text>
  <rect x="726" y="326" width="218" height="44" rx="4" fill="#0b1020" stroke="#30363d"/>
  <text x="736" y="344" fill="#c9d1d9" font-size="10">orders-compensate</text>
  <text x="736" y="360" fill="#6e7681" font-size="9">maxDelivery 10 · dead-letter alert</text>
  <line x1="660" y1="362" x2="706" y2="330" stroke="#d29922" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- workers -->
  <rect x="710" y="430" width="250" height="76" rx="7" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="835" y="452" fill="#3fb950" font-size="12" font-weight="600" text-anchor="middle">step_worker</text>
  <text x="835" y="470" fill="#c9d1d9" font-size="10" text-anchor="middle">reserve stock → authorise payment</text>
  <text x="835" y="488" fill="#6e7681" font-size="9" text-anchor="middle">guard 1: already done? · guard 2: idempotency key</text>
  <line x1="835" y1="390" x2="835" y2="426" stroke="#d29922" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="710" y="524" width="250" height="60" rx="7" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="835" y="546" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="middle">saga_advance</text>
  <text x="835" y="564" fill="#6e7681" font-size="9" text-anchor="middle">only place that decides CONFIRMED</text>
  <line x1="835" y1="506" x2="835" y2="520" stroke="#d29922" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="710" y="602" width="250" height="60" rx="7" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="835" y="624" fill="#f85149" font-size="12" font-weight="600" text-anchor="middle">compensation_worker</text>
  <text x="835" y="642" fill="#6e7681" font-size="9" text-anchor="middle">release stock · refund auth → CANCELLED</text>
  <line x1="835" y1="584" x2="835" y2="598" stroke="#d29922" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- back to cosmos -->
  <path d="M 706 468 C 620 468 600 220 664 210" fill="none" stroke="#3fb950" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ag)"/>
  <text x="596" y="440" fill="#3fb950" font-size="9">etag-guarded transition</text>
  <text x="596" y="454" fill="#6e7681" font-size="9">412 → no-op, never a 2nd charge</text>

  <!-- state machine -->
  <rect x="28" y="240" width="300" height="180" rx="7" fill="#0b1020" stroke="#30363d"/>
  <text x="44" y="264" fill="#e6edf3" font-size="12" font-weight="600">Order state machine</text>
  <g font-size="10">
    <rect x="44" y="274" width="122" height="24" rx="12" fill="#161b22" stroke="#8b949e"/>
    <text x="105" y="290" fill="#c9d1d9" text-anchor="middle">CREATED</text>
    <rect x="178" y="274" width="134" height="24" rx="12" fill="#161b22" stroke="#8b949e"/>
    <text x="245" y="290" fill="#c9d1d9" text-anchor="middle">STOCK_RESERVED</text>
    <rect x="44" y="308" width="170" height="24" rx="12" fill="#161b22" stroke="#8b949e"/>
    <text x="129" y="324" fill="#c9d1d9" text-anchor="middle">PAYMENT_AUTHORISED</text>
    <rect x="226" y="308" width="86" height="24" rx="12" fill="#161b22" stroke="#3fb950"/>
    <text x="269" y="324" fill="#3fb950" text-anchor="middle">CONFIRMED</text>
    <rect x="44" y="352" width="120" height="24" rx="12" fill="#161b22" stroke="#f85149"/>
    <text x="104" y="368" fill="#f85149" text-anchor="middle">COMPENSATING</text>
    <rect x="178" y="352" width="94" height="24" rx="12" fill="#161b22" stroke="#f85149"/>
    <text x="225" y="368" fill="#f85149" text-anchor="middle">CANCELLED</text>
    <rect x="44" y="386" width="120" height="24" rx="12" fill="#161b22" stroke="#d29922"/>
    <text x="104" y="402" fill="#d29922" text-anchor="middle">STUCK → human</text>
  </g>

  <!-- telemetry -->
  <rect x="1000" y="240" width="212" height="150" rx="7" fill="#161b22" stroke="#30363d"/>
  <text x="1106" y="264" fill="#e6edf3" font-size="11" font-weight="600" text-anchor="middle">App Insights</text>
  <text x="1014" y="286" fill="#6e7681" font-size="9">one operation_Id per order</text>
  <text x="1014" y="304" fill="#6e7681" font-size="9">HTTP → outbox → step → saga →</text>
  <text x="1014" y="320" fill="#6e7681" font-size="9">compensation = one trace</text>
  <text x="1014" y="344" fill="#3fb950" font-size="9">structured events:</text>
  <text x="1014" y="360" fill="#6e7681" font-size="9">order_created · step_noop</text>
  <text x="1014" y="374" fill="#6e7681" font-size="9">outbox_published · order_cancelled</text>

  <!-- invariants strip -->
  <rect x="28" y="690" width="1184" height="86" rx="7" fill="#0b1020" stroke="#30363d"/>
  <text x="44" y="714" fill="#e6edf3" font-size="12" font-weight="600">Asserted by tests/ and scripts/load-test.py — not hoped for</text>
  <g font-size="10">
    <text x="44" y="738" fill="#3fb950">✓ duplicate message never double-charges</text>
    <text x="44" y="756" fill="#6e7681">test_duplicate_transition_is_a_noop_not_a_second_effect</text>
    <text x="350" y="738" fill="#3fb950">✓ two workers racing → exactly one effect</text>
    <text x="350" y="756" fill="#6e7681">test_two_workers_racing_produce_one_effect</text>
    <text x="656" y="738" fill="#3fb950">✓ order + outbox written atomically</text>
    <text x="656" y="756" fill="#6e7681">test_order_and_outbox_are_written_atomically</text>
    <text x="962" y="738" fill="#3fb950">✓ no order left stuck</text>
    <text x="962" y="756" fill="#6e7681">load-test.py exits 1 if any invariant breaks</text>
  </g>
</svg>
